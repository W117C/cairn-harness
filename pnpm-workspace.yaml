packages:
  - apps/*
  - apps/desktop/preview
allowBuilds:
  electron: true
  esbuild: true
minimumReleaseAgeExclude:
  - lucide-react@1.56.0
  - react-resizable-panels@4.14.5
onlyBuiltDependencies:
  - esbuild
# 第 473 页：pnpm 11 **不再读** package.json 的 `pnpm` 字段（写在那儿会被警告并忽略，overrides 静默失效），
# 所以下面这一格必须住在这里。source-map-js 是 postcss ← vite/vitest 的传递依赖，postcss 自己的范围
# （`^1.2.1`）已经容得下 1.2.2，但 `pnpm update -r` 没能把它抬上去 ⇒ 用 overrides 钉死补丁线。
overrides:
  source-map-js: "^1.2.2"
  # GHSA-mrhx-c7xc-m3w5：zod 3.x 没有补丁线，MCP SDK 已声明兼容 ^4.0，
  # 因此把传递依赖抬到 4.6.7。zod-to-json-schema 同样声明支持 zod 4。
  zod: "^4.6.7"
  # GHSA-qv5m-9pm6-hqp3（WebSocket 升级期 ECONNRESET 崩进程）＋ GHSA-jpvv-r467-5p4w
  # （反斜杠路径绕过反向代理的访问控制）：@hono/node-server 是 MCP SDK 的传递依赖，
  # SDK 范围 ^1.19.9 || ^2.0.5 容得下 2.1.6，但 pnpm 死守旧解析 ⇒ 用 overrides 抬到补丁线。
  "@hono/node-server": "^2.1.6"
  # 2026-11-14：hono 自身五条（补丁线 4.13.16）——mount 前缀绕过中间件（GHSA-4m76-xfj5-7975）、
  # RegExpRouter 跳过通配中间件（GHSA-h7mg-cq63-vhpq）、csrf 不查 text/ping（GHSA-46wx-v44x-9hh2）、
  # validator('form') 在 multipart 带额外参数时跳过校验（GHSA-4h7h-rv7c-7m2v）、css helper 转义
  # （GHSA-3gg2-335m-rxc6）。它同样是 @modelcontextprotocol/sdk 的传递依赖（SDK 的 ^4 范围容得下），
  # 与上面 @hono/node-server 同一条抬线理由。
  hono: "^4.13.16"
