packages:
  - apps/*
  - apps/desktop/preview
allowBuilds:
  electron: true
  esbuild: true
minimumReleaseAgeExclude:
  - lucide-react@1.56.0
  - react-resizable-panels@4.14.5
onlyBuiltDependencies:
  - esbuild
# 第 473 页：pnpm 11 **不再读** package.json 的 `pnpm` 字段（写在那儿会被警告并忽略，overrides 静默失效），
# 所以下面这一格必须住在这里。source-map-js 是 postcss ← vite/vitest 的传递依赖，postcss 自己的范围
# （`^1.2.1`）已经容得下 1.2.2，但 `pnpm update -r` 没能把它抬上去 ⇒ 用 overrides 钉死补丁线。
overrides:
  source-map-js: "^1.2.2"
  # GHSA-rmxm-3fg6-px4f / GHSA-6pq8-jhm2-2vcw：传递依赖补丁线。2026-11-13 抬到 2.1.6+：
  # GHSA-qv5m-9pm6-hqp3（WebSocket 升级期 ECONNRESET 崩进程）＋ GHSA-jpvv-r467-5p4w
  # （反斜杠路径绕过反向代理访问控制）都在 2.1.6 修复；旧钉 2.1.3 正是 Dependabot 两条
  # 开放告警的根源。
  "@hono/node-server": "^2.1.6"
  qs: "6.16.1"
  # GHSA-mrhx-c7xc-m3w5：zod 3.x 没有补丁线，MCP SDK 已声明兼容 ^4.0，
  # 因此把传递依赖抬到 4.6.7。zod-to-json-schema 同样声明支持 zod 4。
  zod: "^4.6.7"
