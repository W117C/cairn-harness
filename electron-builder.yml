# M4b §2.5：可安装包（macOS dmg + zip）。产物布局：electron-vite 产出 out/{main,preload,renderer}，
# package.json main = out/main/index.js。输出到 dist/（已 gitignore；electron-vite 实际用 out/，互不冲突）。
# V1 边界（任务书 §2.5 拍板）：不配签名/公证（无 Apple 开发者账号）——产物 unsigned/ad-hoc，
# 首次打开需右键 → 打开（Gatekeeper 提示）；文档在 docs/m4-acceptance.md 说明。
appId: com.deepseekharness.m0agent
productName: M0 Agent
directories:
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
# spawn 二进制与 wasm 不解包无法用（rg 由 grep 工具 spawn；tree-sitter wasm 由 fs 读取——
# fs 在 asar 内透明可用，spawn 必须真路径）。
# I7（审查 P2）：tree-sitter-wasms 全量解包 49M（dmg 120M/.app 310M 的主因）——只解包
# 实际用到的四个 grammar（parse.ts LANG_BY_EXT：typescript/tsx/javascript/python），其余留 asar。
asarUnpack:
  - node_modules/@vscode/ripgrep/**
  - node_modules/tree-sitter-wasms/out/tree-sitter-typescript.wasm
  - node_modules/tree-sitter-wasms/out/tree-sitter-tsx.wasm
  - node_modules/tree-sitter-wasms/out/tree-sitter-javascript.wasm
  - node_modules/tree-sitter-wasms/out/tree-sitter-python.wasm
mac:
  identity: null
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
electronLanguages:
  - zh-CN
  - en
npmRebuild: false
