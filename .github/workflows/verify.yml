# L1 自动兜底（M9）：typecheck + 全量判卷 + 快门面。推上去才生效，本地零影响。
# 取舍、成本、以及"为什么这里排除了两道门"见 scripts/ci/README.md（L2 pre-commit 已裁定不做，
# 理由与一键启用路径也在那里）。
#
# runner 选 macos-latest 的理由（诚实标注）：本仓开发环境是 macOS，沙箱与平台分支的判卷按它写；
# ubuntu 迁移是另一件事，换 runner 之前要先在真实 CI 上验证一轮（本机无法验证 Linux 行为，
# 所以这里不假装 ubuntu 也行——见 README「换 runner 前先做什么」）。
name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: full test suite
        run: pnpm test
      # 快门面 = CERT_GATES 那 22 道，逐字点名（`pnpm gates` 不加参数跑的是 GATES 全集，比认证面慢、面也不同）。
      # 这一行从前**排除**过两道已知红：gate-check 的 H7 与 mutate-needles-check 的 4 支失针锚点。
      # 两条理由到 10-02 都已结案 ⇒ 名单补回来。现读凭证：认证树 `认证门面=22 道（跑到 22）｜绿 22 道`
      # （`outputs/retry-backoff-2026-10-02/head-cert-7cc9605.log`，TREE=7cc9605、DIRTY_JUDGED=0）。
      # ⚠️ 但**本仓没有 git remote** ⇒ 这份 workflow 至今一次也没真跑过：它的正确性目前只由 head-cert 保证。
      #    "接不接远端"是业主裁决项（取舍见 scripts/ci/README.md），这条改动只是让名单不再谎报红灯。
      - name: fast gates (cert face, 22)
        run: >-
          pnpm gates
          --only=no-progress-check,prune-check,fork-check,compaction-check,docs-check,memory-check,head-import-check,autonomy-check,sandbox:check,security-check,provider:check,routing-check,model-surface-check,prefix-churn-check,prompt-surface-check,replay-determinism-check,cost-per-progress-check,web-fetch-check,gym-check,evidence-typecheck-check,gate-check,mutate-needles-check,repo-hygiene-check
