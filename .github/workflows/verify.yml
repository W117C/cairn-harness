# Public L1 verification: typecheck + core/desktop tests + product-contract gates.
# Heavy release certification (head-cert, mutation testing) and internal evidence
# audits are intentionally not part of a public pull request.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # head-import-face 这类产品门会对比 HEAD 与 HEAD~1；浅克隆会把它误读成 null。
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
        # Version comes from package.json#packageManager only — do not add a second copy here.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Electron runtime matches installed package
        timeout-minutes: 5
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: >-
          pnpm --filter cairn-desktop exec electron -e
          'const assert = require("node:assert/strict"); const expected = require("electron/package.json").version; assert.equal(process.versions.electron, expected); console.log(JSON.stringify(process.versions));'
      - run: pnpm verify
