<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Cairn</title>
    <!-- 启动占位（2026-10-21）：在 CSS bundle 与 React 之前就画出底色与品牌标记，
         避免 Electron 首帧白闪。颜色取 Claude Desktop v3.1623.0 的 surface-1：
         亮 #fcfcfb / 暗 #151515；品牌 clay #d97757。root 一旦有子节点即淡出。 -->
    <style>
      html, body { margin: 0; background: #fcfcfb; }
      #boot {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; background: #fcfcfb; color: #6b6a64;
        font-family: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
        pointer-events: none;
        transition: opacity .18s ease, visibility 0s linear .18s;
      }
      #boot .boot-mark {
        display: grid; place-items: center; width: 30px; height: 30px;
        border-radius: 9px; background: #d97757; color: #fff;
        font-size: 17px; font-weight: 600; line-height: 1;
      }
      #boot .boot-name { font-size: 14px; font-weight: 600; letter-spacing: .02em; }
      #boot .boot-line {
        position: relative; width: 96px; height: 2px; overflow: hidden;
        border-radius: 999px; background: rgb(0 0 0 / 8%);
      }
      #boot .boot-line::after {
        content: ""; position: absolute; inset: 0; width: 40%;
        border-radius: inherit; background: #d97757;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      #boot .boot-hint { font-size: 12px; color: #8a887f; }
      #root:not(:empty) + #boot { opacity: 0; visibility: hidden; }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #151515; }
        #boot { background: #151515; color: #b8b6ad; }
        #boot .boot-line { background: rgb(255 255 255 / 10%); }
        #boot .boot-hint { color: #8a887f; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-line::after { animation: none; width: 100%; }
        #boot { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">
      <span class="boot-mark" aria-hidden="true">C</span>
      <span class="boot-name">Cairn</span>
      <span class="boot-line" aria-hidden="true"></span>
      <span class="boot-hint">正在启动…</span>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
