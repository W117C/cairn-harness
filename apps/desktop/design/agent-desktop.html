<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cairn · Agent 桌面端（OpenAI 风格原型）</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   OpenAI-style 设计系统（light）
   参照 OpenAI ChatGPT 桌面端：白底、克制灰、单一品牌绿强调、
   圆角药丸、轻量描边、克制的阴影与动效。
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --canvas:#ffffff; --panel:#f9f9f9; --panel-2:#f3f3f3; --panel-3:#ececec;
  --side:#f7f7f8; --side-active:#ececef;
  --line:#e5e5e5; --line-strong:#d9d9e3;
  --t1:#0d0d0d; --t2:#353a44; --t3:#8e8ea0; --t4:#b4b4c0;
  --brand:#10a37f; --brand-ink:#0d8a6b; --brand-soft:#e7f6f1;
  --ink:#0d0d0d;
  --ok:#10a37f; --warn:#c98a00; --danger:#e02e2e; --info:#3b82f6; --run:#10a37f; --wait:#8e8ea0;
  --diff-add-bg:#e8f6ee; --diff-del-bg:#fbe9e9; --diff-add-ink:#1a7f3f; --diff-del-ink:#b3261e;
  --code-bg:#0d0d0d; --code-fg:#e6e6e6;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-sm:8px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --fs-2xs:10.5px; --fs-xs:11.5px; --fs-sm:12.5px; --fs-md:13.5px; --fs-lg:15px; --fs-xl:17px; --fs-2xl:21px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 1px 4px rgba(0,0,0,.03);
  --shadow-pop:0 10px 30px -6px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);
  --side-w:280px; --right-w:420px; --read:820px;
  --t-fast:120ms ease; --t-med:200ms cubic-bezier(.2,.8,.2,1);
}
[data-theme="dark"]{
  --canvas:#212121; --panel:#2a2a2a; --panel-2:#2f2f2f; --panel-3:#383838;
  --side:#1f1f1f; --side-active:#2c2c2c;
  --line:#3a3a3a; --line-strong:#4a4a4a;
  --t1:#ececec; --t2:#b4b4b4; --t3:#8e8e8e; --t4:#6a6a6a;
  --brand:#19c39a; --brand-ink:#19c39a; --brand-soft:#13332c;
  --ok:#19c39a; --warn:#e0a93b; --danger:#ff6b6b; --info:#6ea8fe;
  --diff-add-bg:#16301f; --diff-del-bg:#3a2320; --diff-add-ink:#5fd49a; --diff-del-ink:#ff8585;
  --shadow-card:0 1px 2px rgba(0,0,0,.3); --shadow-pop:0 10px 30px -6px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
::selection{background:rgba(16,163,127,.22);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:#bdbdc9;background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid rgba(16,163,127,.55);outline-offset:2px;border-radius:var(--r-sm);}
html,body{height:100%;}
body{margin:0;font:var(--fs-md)/1.6 var(--sans);color:var(--t1);background:var(--canvas);-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
input,textarea{font:inherit;color:inherit;}
.num{font-variant-numeric:tabular-nums;}
svg{display:block;}

/* ── 应用骨架 ───────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--side-w) 1fr;height:100vh;transition:grid-template-columns var(--t-med);}
.app.right-open{grid-template-columns:var(--side-w) 1fr var(--right-w);}
.app.side-collapsed{grid-template-columns:0 1fr;}
.app.side-collapsed.right-open{grid-template-columns:0 1fr var(--right-w);}

/* ── 左栏 ──────────────────────────────────────────────── */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.side-head{padding:var(--s3) var(--s3) var(--s2);display:flex;flex-direction:column;gap:var(--s2);}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:650;font-size:var(--fs-lg);letter-spacing:-.01em;}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:#fff;}
.icon-btn{width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--t2);transition:background var(--t-fast);}
.icon-btn:hover{background:var(--side-active);}
.icon-btn.on{background:var(--brand-soft);color:var(--brand-ink);}
.new-chat{display:flex;align-items:center;justify-content:center;gap:var(--s2);height:38px;border-radius:var(--r-md);background:var(--t1);color:#fff;font-weight:600;font-size:var(--fs-md);transition:opacity var(--t-fast),transform var(--t-fast);}
.new-chat:hover{opacity:.9;}
.new-chat:active{transform:translateY(1px);}
.side-tools{display:flex;align-items:center;gap:var(--s2);}
.search{flex:1;display:flex;align-items:center;gap:var(--s2);height:34px;padding:0 var(--s3);border-radius:var(--r-pill);background:var(--panel);border:1px solid transparent;color:var(--t2);transition:border var(--t-fast),background var(--t-fast);}
.search:focus-within{border-color:var(--line-strong);background:var(--canvas);}
.search input{flex:1;border:0;outline:0;background:none;font-size:var(--fs-sm);color:var(--t1);}
.view-toggle{display:flex;background:var(--panel);border-radius:var(--r-sm);padding:2px;}
.view-toggle button{width:28px;height:26px;border-radius:6px;color:var(--t3);display:grid;place-items:center;}
.view-toggle button.on{background:var(--canvas);color:var(--t1);box-shadow:var(--shadow-card);}

.side-scroll{flex:1;overflow-y:auto;padding:var(--s2) var(--s2) var(--s4);}
.empty-hint{color:var(--t3);font-size:var(--fs-sm);text-align:center;padding:var(--s5) var(--s3);}

/* 文件夹 / 会话项 */
.group{margin-bottom:2px;}
.group-head{display:flex;align-items:center;gap:var(--s2);padding:6px var(--s2);border-radius:var(--r-sm);cursor:pointer;color:var(--t2);font-size:var(--fs-sm);font-weight:600;}
.group-head:hover{background:var(--panel);}
.group-head .chev{transition:transform var(--t-fast);color:var(--t3);}
.group.collapsed .chev{transform:rotate(-90deg);}
.group-head .gname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.group-head .gcount{font-size:var(--fs-2xs);color:var(--t3);background:var(--panel-3);border-radius:var(--r-pill);padding:1px 7px;}
.group-head .gmenu{opacity:0;transition:opacity var(--t-fast);}
.group-head:hover .gmenu{opacity:1;}
.group-body{margin-left:6px;border-left:1px solid var(--line);padding-left:6px;overflow:hidden;}
.group.collapsed .group-body{display:none;}

.sess{display:flex;align-items:center;gap:var(--s2);padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;position:relative;color:var(--t1);}
.sess:hover{background:var(--panel);}
.sess.active{background:var(--side-active);}
.sess .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--t4);}
.sess .dot.run{background:var(--run);}
.sess .dot.wait{background:var(--wait);}
.sess .dot.err{background:var(--danger);}
.sess .stitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-sm);}
.sess .stime{font-size:var(--fs-2xs);color:var(--t3);flex:none;}
.sess .smenu{opacity:0;color:var(--t3);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;}
.sess:hover .smenu{opacity:1;}
.sess .smenu:hover{background:var(--panel-3);color:var(--t1);}
.pin-flag{color:var(--brand);display:inline-grid;place-items:center;flex:none;}
.rename-input{width:100%;border:1px solid var(--brand);border-radius:6px;padding:3px 6px;font-size:var(--fs-sm);outline:0;background:var(--canvas);}

/* 菜单 */
.menu{position:fixed;z-index:60;min-width:184px;background:var(--canvas);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-pop);padding:6px;animation:pop var(--t-fast);}
@keyframes pop{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.menu button{display:flex;align-items:center;gap:var(--s3);width:100%;padding:8px 10px;border-radius:var(--r-sm);font-size:var(--fs-sm);color:var(--t1);text-align:left;}
.menu button:hover{background:var(--panel);}
.menu button.danger{color:var(--danger);}
.menu button.danger:hover{background:var(--diff-del-bg);}
.menu .sep{height:1px;background:var(--line);margin:5px 4px;}
.menu .glyph{width:16px;height:16px;color:var(--t2);flex:none;}
.menu kbd{margin-left:auto;font-size:var(--fs-2xs);color:var(--t3);font-family:var(--mono);}

/* ── 中栏 ──────────────────────────────────────────────── */
.main{display:flex;flex-direction:column;min-width:0;background:var(--canvas);}
.main-head{height:52px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--s2);padding:0 var(--s3);}
.main-head .htitle{flex:1;font-weight:600;font-size:var(--fs-md);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.thread-wrap{flex:1;overflow-y:auto;position:relative;}
.thread{max-width:var(--read);margin:0 auto;padding:var(--s5) var(--s4) 40px;display:flex;flex-direction:column;gap:var(--s4);}

/* 时间线 rail */
.rail{position:absolute;left:max(8px,calc(50% - var(--read)/2 - 26px));top:0;bottom:0;width:2px;background:var(--line);}
.rail .node{position:absolute;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--canvas);border:2px solid var(--line-strong);cursor:pointer;transition:transform var(--t-fast),box-shadow var(--t-fast);}
.rail .node:hover{transform:scale(1.35);box-shadow:0 0 0 4px var(--brand-soft);}
@media (max-width:1100px){.rail{display:none;}}

/* 消息 */
.msg{display:grid;grid-template-columns:40px 1fr;gap:var(--s3);position:relative;}
.msg.flash{animation:flash 1.3s ease;}
@keyframes flash{0%,100%{background:none;}15%{background:var(--brand-soft);}}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:var(--fs-sm);align-self:start;margin-top:2px;}
.avatar.user{background:var(--t1);color:#fff;}
.avatar.assistant{background:var(--brand-soft);color:var(--brand-ink);}
.bubble{min-width:0;}
.meta{display:flex;align-items:center;gap:var(--s2);margin-bottom:5px;font-size:var(--fs-2xs);color:var(--t3);}
.meta .who{font-weight:600;color:var(--t2);}
.body{font-size:var(--fs-md);color:var(--t1);line-height:1.7;}
.body p{margin:0 0 10px;}
.body pre{background:var(--code-bg);color:var(--code-fg);border-radius:var(--r-md);padding:var(--s3);overflow:auto;font:var(--fs-sm)/1.6 var(--mono);margin:8px 0;}
.body code{font-family:var(--mono);font-size:.92em;background:var(--panel-3);padding:1px 5px;border-radius:5px;}
.body pre code{background:none;padding:0;}

/* 思考块 */
.thinking{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);margin:6px 0;overflow:hidden;}
.thinking>summary{display:flex;align-items:center;gap:var(--s2);padding:8px 12px;cursor:pointer;font-size:var(--fs-sm);color:var(--t2);list-style:none;}
.thinking>summary::-webkit-details-marker{display:none;}
.thinking>summary .spin{width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.thinking .tcontent{padding:0 12px 10px;color:var(--t2);font-size:var(--fs-sm);line-height:1.65;border-top:1px dashed var(--line);margin-top:2px;padding-top:8px;}

/* 工具调用块 */
.tool{border:1px solid var(--line);border-radius:var(--r-md);margin:6px 0;overflow:hidden;background:var(--canvas);}
.tool>summary{display:flex;align-items:center;gap:var(--s2);padding:8px 12px;cursor:pointer;list-style:none;font-size:var(--fs-sm);}
.tool>summary::-webkit-details-marker{display:none;}
.tool .tname{font-weight:600;color:var(--t1);}
.tool .tbadge{font-size:var(--fs-2xs);color:var(--t3);background:var(--panel-3);border-radius:var(--r-pill);padding:1px 7px;}
.tool .tstatus{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:var(--fs-2xs);color:var(--t3);}
.tool .tstatus.ok{color:var(--ok);}
.tool .tstatus.run{color:var(--run);}
.tool .tbody{padding:0 12px 10px;}
.tool .tline{font:var(--fs-xs)/1.55 var(--mono);color:var(--t2);white-space:pre-wrap;word-break:break-word;}
.tool .tline .k{color:var(--brand-ink);}

/* 等待动效 */
.waiting{display:flex;align-items:center;gap:var(--s2);color:var(--t3);font-size:var(--fs-sm);padding:4px 0;}
.waiting .bub{display:flex;gap:4px;}
.waiting .bub i{width:7px;height:7px;border-radius:50%;background:var(--t3);opacity:.4;animation:blink 1.2s infinite;}
.waiting .bub i:nth-child(2){animation-delay:.2s;}
.waiting .bub i:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,100%{opacity:.3;transform:translateY(0);}50%{opacity:1;transform:translateY(-2px);}}

/* 动作条 */
.actions{display:flex;align-items:center;gap:2px;margin-top:6px;opacity:0;transition:opacity var(--t-fast);}
.msg:hover .actions{opacity:1;}
.actions button{display:flex;align-items:center;gap:5px;height:28px;padding:0 8px;border-radius:var(--r-sm);font-size:var(--fs-xs);color:var(--t2);}
.actions button:hover{background:var(--panel);color:var(--t1);}
.actions .grow{flex:1;}

/* 空态 */
.empty-main{flex:1;display:grid;place-items:center;text-align:center;color:var(--t3);}
.empty-main .big{font-size:var(--fs-2xl);font-weight:600;color:var(--t1);margin-bottom:var(--s2);}
.empty-main .pills{display:flex;gap:var(--s2);flex-wrap:wrap;justify-content:center;margin-top:var(--s4);}
.empty-main .pill{border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 14px;font-size:var(--fs-sm);color:var(--t2);}

/* ── Composer ──────────────────────────────────────────── */
.composer{flex:none;border-top:1px solid var(--line);padding:var(--s3) var(--s4) var(--s4);background:var(--canvas);}
.composer-inner{max-width:var(--read);margin:0 auto;display:flex;flex-direction:column;gap:var(--s2);}

/* 目标面板 */
.goal{display:flex;align-items:center;gap:var(--s2);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--r-md);padding:8px 10px;background:var(--panel);}
.goal .gicon{color:var(--brand);flex:none;}
.goal .gtext{flex:1;min-width:0;}
.goal .gtitle{font-size:var(--fs-xs);color:var(--t3);font-weight:600;letter-spacing:.02em;}
.goal .gdesc{font-size:var(--fs-sm);color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.goal .gbtn{height:28px;padding:0 10px;border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:600;display:flex;align-items:center;gap:5px;background:var(--canvas);border:1px solid var(--line);}
.goal .gbtn:hover{background:var(--panel-2);}
.goal.paused{border-left-color:var(--warn);}
.goal.paused .gicon{color:var(--warn);}

/* 任务进程面板 */
.task{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:var(--r-md);padding:9px 11px;background:var(--panel);}
.task .trow{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm);}
.task .trow .tlabel{flex:1;}
.task .progress{height:6px;border-radius:var(--r-pill);background:var(--panel-3);overflow:hidden;}
.task .progress i{display:block;height:100%;background:var(--brand);border-radius:var(--r-pill);transition:width var(--t-med);}
.task .tstep{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-xs);color:var(--t2);}
.task .tstep .mk{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--line-strong);color:transparent;}
.task .tstep.done .mk{background:var(--brand);border-color:var(--brand);color:#fff;}
.task .tstep.active .mk{border-color:var(--brand);color:var(--brand);}

/* 指令面板 */
.instr{position:relative;border:1px solid var(--line);border-radius:var(--r-md);background:var(--canvas);padding:var(--s2);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.instr button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:var(--r-sm);font-size:var(--fs-xs);color:var(--t2);border:1px solid transparent;}
.instr button:hover{background:var(--panel);border-color:var(--line);color:var(--t1);}
.instr button .ic{width:20px;height:20px;color:var(--t1);}
.instr .closex{position:absolute;top:6px;right:6px;}

/* 输入卡 */
.input-card{border:1px solid var(--line-strong);border-radius:var(--r-lg);background:var(--canvas);box-shadow:var(--shadow-card);overflow:hidden;transition:border var(--t-fast);}
.input-card:focus-within{border-color:var(--brand);}
.textbox{position:relative;}
.textbox textarea{width:100%;border:0;outline:0;resize:none;background:none;padding:var(--s3) var(--s4);font-size:var(--fs-md);line-height:1.6;max-height:200px;display:block;font-family:var(--sans);}
.input-bar{display:flex;align-items:center;gap:var(--s2);padding:6px var(--s3) 8px;flex-wrap:wrap;}

/* 权限分段 */
.seg{display:flex;background:var(--panel);border-radius:var(--r-pill);padding:3px;gap:2px;}
.seg button{display:flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600;color:var(--t2);white-space:nowrap;}
.seg button.on{background:var(--canvas);color:var(--t1);box-shadow:var(--shadow-card);}
.seg button .d{width:7px;height:7px;border-radius:50%;}
.seg .m-ask .d{background:var(--wait);}
.seg .m-auto .d{background:var(--brand);}
.seg .m-full .d{background:var(--ok);}

/* 选择器 */
.select{position:relative;}
.select>button{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r-sm);font-size:var(--fs-xs);color:var(--t2);border:1px solid var(--line);background:var(--canvas);}
.select>button:hover{border-color:var(--line-strong);}
.select .pop{position:absolute;bottom:calc(100% + 6px);left:0;min-width:210px;background:var(--canvas);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-pop);padding:6px;z-index:50;animation:pop var(--t-fast);}
.select .opt{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-sm);}
.select .opt:hover{background:var(--panel);}
.select .opt.sel{background:var(--brand-soft);color:var(--brand-ink);}
.select .opt .sub{font-size:var(--fs-2xs);color:var(--t3);}
.select .opt.sel .sub{color:var(--brand-ink);opacity:.8;}

/* 上下文占用 */
.ctx{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--t3);}
.ctx .bar{width:54px;height:6px;border-radius:var(--r-pill);background:var(--panel-3);overflow:hidden;}
.ctx .bar i{display:block;height:100%;background:var(--brand);}
.ctx.warn .bar i{background:var(--warn);}
.ctx.fatal .bar i{background:var(--danger);}

.send{margin-left:auto;width:36px;height:36px;border-radius:var(--r-pill);background:var(--t1);color:#fff;display:grid;place-items:center;transition:opacity var(--t-fast);}
.send:hover{opacity:.9;}
.send:disabled{opacity:.35;cursor:not-allowed;}
.send.busy{background:var(--brand);}

/* 输入卡工具行（图标按钮） */
.tbtn{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--t2);}
.tbtn:hover{background:var(--panel);color:var(--t1);}
.tbtn.on{color:var(--brand-ink);background:var(--brand-soft);}
.tbtn.active-instr{color:var(--brand-ink);}

/* ── 右栏 ──────────────────────────────────────────────── */
.right{background:var(--canvas);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;}

/* 封面 */
.cover{flex:1;display:grid;place-items:center;padding:var(--s5);}
.cover-inner{display:flex;flex-direction:column;align-items:center;gap:var(--s4);max-width:300px;text-align:center;}
.cover h2{font-size:var(--fs-xl);font-weight:650;margin:0;letter-spacing:-.01em;}
.cover p{margin:0;color:var(--t3);font-size:var(--fs-sm);}
.cover-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);width:100%;}
.cover-card{display:flex;flex-direction:column;align-items:center;gap:var(--s2);padding:var(--s4);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--canvas);transition:border var(--t-fast),transform var(--t-fast),box-shadow var(--t-fast);}
.cover-card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:var(--shadow-card);}
.cover-card .cic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--panel);color:var(--t1);}
.cover-card .ct{font-size:var(--fs-sm);font-weight:600;}

/* 标签栏 */
.tabs{height:40px;flex:none;display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;}
.tab{display:flex;align-items:center;gap:var(--s2);height:30px;padding:0 8px 0 11px;border-radius:var(--r-sm);font-size:var(--fs-xs);color:var(--t2);white-space:nowrap;cursor:pointer;border:1px solid transparent;flex:none;}
.tab.on{background:var(--canvas);color:var(--t1);border-color:var(--line);}
.tab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--t3);}
.tab .x:hover{background:var(--panel-3);color:var(--t1);}
.tab .tic{width:15px;height:15px;color:var(--t2);}
.tab-add{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--t2);flex:none;}
.tab-add:hover{background:var(--panel-3);}

.right-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.panel-pane{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}

/* 浏览器 */
.browser .btool{display:flex;align-items:center;gap:var(--s2);padding:8px 10px;border-bottom:1px solid var(--line);}
.browser .bnav{display:flex;gap:2px;}
.browser .bnav .icon-btn{width:28px;height:28px;}
.browser .burl{flex:1;height:30px;border-radius:var(--r-pill);background:var(--panel);border:1px solid transparent;padding:0 12px;font-size:var(--fs-xs);color:var(--t2);display:flex;align-items:center;gap:6px;overflow:hidden;}
.browser .burl:focus-within{border-color:var(--line-strong);background:var(--canvas);}
.browser iframe,.browser .bview{flex:1;width:100%;border:0;background:var(--canvas);overflow:auto;}

/* 终端 */
.term{flex:1;background:#0d0d0d;color:#e6e6e6;font:var(--fs-sm)/1.55 var(--mono);padding:var(--s3);overflow:auto;}
.term .line{white-space:pre-wrap;word-break:break-word;}
.term .pr{color:#19c39a;}
.term .er{color:#ff8585;}
.term .ok{color:#5fd49a;}
.term .input-line{display:flex;gap:8px;align-items:baseline;}
.term .input-line input{flex:1;background:none;border:0;outline:0;color:#e6e6e6;font:inherit;caret-color:#19c39a;}
.term .cursor{display:inline-block;width:8px;height:15px;background:#19c39a;animation:blink2 1s steps(1) infinite;vertical-align:middle;}
@keyframes blink2{50%{opacity:0;}}

/* 审查 */
.review .rhead{display:flex;align-items:center;gap:var(--s2);padding:8px 12px;border-bottom:1px solid var(--line);font-size:var(--fs-sm);}
.review .rfile{font-weight:600;}
.review .radd{color:var(--ok);font-size:var(--fs-xs);}
.review .rdel{color:var(--danger);font-size:var(--fs-xs);}
.diff{flex:1;overflow:auto;font:var(--fs-xs)/1.6 var(--mono);background:var(--canvas);}
.diff .drow{display:flex;white-space:pre-wrap;word-break:break-word;padding:0 12px;}
.diff .drow .g{width:32px;flex:none;color:var(--t4);user-select:none;text-align:right;padding-right:8px;}
.diff .add{background:var(--diff-add-bg);}
.diff .add .g{color:var(--diff-add-ink);}
.diff .del{background:var(--diff-del-bg);}
.diff .del .g{color:var(--diff-del-ink);}
.diff .ctx{color:var(--t2);}
.review .rfoot{display:flex;gap:var(--s2);padding:8px 12px;border-top:1px solid var(--line);}
.review .rfoot button{flex:1;height:32px;border-radius:var(--r-sm);font-size:var(--fs-xs);font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;}
.review .rfoot .ok{border:1px solid var(--ok);color:var(--ok);}
.review .rfoot .no{border:1px solid var(--line-strong);color:var(--t2);}

/* 辅助对话 */
.aux{flex:1;overflow-y:auto;padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3);}
.aux .m{display:flex;gap:var(--s2);max-width:90%;}
.aux .m.user{align-self:flex-end;flex-direction:row-reverse;}
.aux .m .bubble2{padding:9px 12px;border-radius:14px;font-size:var(--fs-sm);line-height:1.55;}
.aux .m.assistant .bubble2{background:var(--panel);border-top-left-radius:4px;}
.aux .m.user .bubble2{background:var(--brand);color:#fff;border-top-right-radius:4px;}
.aux .turns{display:flex;gap:5px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.aux .turns button{font-size:var(--fs-2xs);color:var(--t2);border:1px solid var(--line);border-radius:var(--r-pill);padding:2px 9px;}
.aux .turns button.on{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent;}
.aux-input{display:flex;gap:var(--s2);padding:var(--s3);border-top:1px solid var(--line);}
.aux-input input{flex:1;height:34px;border:1px solid var(--line);border-radius:var(--r-pill);padding:0 14px;font-size:var(--fs-sm);outline:0;background:var(--canvas);}
.aux-input input:focus{border-color:var(--brand);}

/* 通用小条 */
.strip{display:flex;align-items:center;gap:var(--s2);padding:8px 12px;border-radius:var(--r-md);font-size:var(--fs-xs);}
.strip.notice{background:var(--brand-soft);color:var(--brand-ink);}
.strip.err{background:var(--diff-del-bg);color:var(--danger);}
.strip .x{margin-left:auto;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--t1);color:#fff;font-size:var(--fs-sm);padding:9px 16px;border-radius:var(--r-pill);box-shadow:var(--shadow-pop);z-index:90;animation:pop var(--t-fast);}

.hidden{display:none !important;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="menu-root"></div>
<div id="toast-root"></div>
<script src="agent-desktop.js"></script>
</body>
</html>
